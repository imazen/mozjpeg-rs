name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Superseded runs only waste runner queue — particularly the macOS
# jobs, which wait on GitHub's scarcest pool. Only the newest
# commit's run matters per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: Linux
            arch: x64
            runner: ubuntu-24.04
          # Linux ARM64
          - os: Linux
            arch: arm64
            runner: ubuntu-24.04-arm
          # macOS x64 (Intel)
          - os: macOS
            arch: x64
            runner: macos-26-intel
          # macOS ARM64 (Apple Silicon)
          - os: macOS
            arch: arm64
            runner: macos-14
          # Windows x64
          - os: Windows
            arch: x64
            runner: windows-2022
          # Windows ARM64
          - os: Windows
            arch: arm64
            runner: windows-11-arm

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        # Only run clippy on main crate lib - sys-local requires local mozjpeg source
        run: cargo clippy -p mozjpeg-rs --lib -- -D warnings
        # Skip clippy on Windows for now due to potential FFI issues
        if: matrix.os != 'Windows'

      - name: Build
        # Only build main crate - sys-local requires local mozjpeg source
        run: cargo build -p mozjpeg-rs

      - name: Build (release)
        run: cargo build -p mozjpeg-rs --release

      - name: Run unit tests
        run: cargo test -p mozjpeg-rs --lib

      - name: Run codec comparison tests
        run: cargo test --test codec_comparison

      - name: Run FFI validation tests (crates.io mozjpeg-sys)
        run: cargo test --test ffi_validation

      - name: Run preset parity tests (vs mozjpeg crate)
        run: cargo test --test preset_parity

      - name: Run C mozjpeg differential tests (crates/sys-config)
        # The C-compat layer moved out of the published crate into the
        # unpublished `sys-config` workspace crate. It builds vendored C via
        # mozjpeg-sys (cmake/nasm), same as this job's earlier FFI steps.
        run: cargo test -p sys-config

      - name: Run decoder round-trip validation
        run: cargo run --release --example decoder_roundtrip

  # Optional-feature API surfaces. The main matrix only exercises default
  # features; the zencodec adapter, imgref integration, and SIMD-intrinsics
  # paths would otherwise only be compiled locally.
  test-features:
    name: Features (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: zencodec
            args: --features zencodec
          - name: no-default-features
            args: --no-default-features
          - name: simd
            args: --features simd
          - name: all-features
            args: --all-features

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p mozjpeg-rs ${{ matrix.args }}

      - name: Test (lib)
        run: cargo test -p mozjpeg-rs --lib ${{ matrix.args }}

      - name: Test (public API integration)
        # encode_tests exercises the public API only — it must compile
        # under every feature combination.
        run: cargo test -p mozjpeg-rs --test encode_tests ${{ matrix.args }}

  # Public-API snapshot freshness (docs/public-api/, via zenutils-apidoc).
  # Regenerate with `just api-doc` after intentional API changes.
  api-doc:
    name: API Doc Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check API snapshot is current
        run: cargo test --manifest-path apidoc/Cargo.toml
        env:
          ZEN_API_DOC: check

  # Tests requiring local mozjpeg source with test exports
  test-ffi-local:
    name: Test FFI Comparison (Local mozjpeg)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Clone mozjpeg C source (with test exports)
        run: |
          cd ..
          git clone --depth=1 https://github.com/imazen/mozjpeg.git mozjpeg

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm libpng-dev

      - name: Build mozjpeg C library
        run: |
          cd ../mozjpeg
          mkdir -p build && cd build
          # The fork's CMake takes BUILD_SHARED_LIBS; ENABLE_SHARED/ENABLE_STATIC
          # are ignored, and without static libs there is no cjpeg-static or
          # libjpeg.a, so exact_trellis_parity skips every test.
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DENABLE_SHARED=OFF -DENABLE_STATIC=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON ..
          make -j$(nproc)

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run sys-local tests
        run: cargo test -p sys-local

      - name: Run FFI parity tests
        run: |
          cargo test --test ffi_validation
          cargo test --test parity_tests
          cargo test --test preset_parity
          cargo test --test chroma_quality_test

      - name: Run byte-exact parity suite vs C oracle
        run: |
          test -x ../mozjpeg/build/cjpeg-static && test -f ../mozjpeg/build/libjpeg.a
          cargo test --test exact_trellis_parity

  # Documentation build
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build documentation
        # Exclude sys-local (requires local mozjpeg C source). Build with the
        # feature-gated surfaces docs.rs shows so their rustdoc is checked too.
        run: cargo doc -p mozjpeg-rs --no-deps --features "zencodec simd-intrinsics png"
        env:
          RUSTDOCFLAGS: -D warnings

  # Minimum supported Rust version check
  msrv:
    name: MSRV (1.89.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Build with MSRV
        # Only build main crate - dev dependencies may require newer Rust
        run: cargo build -p mozjpeg-rs

  # Code coverage
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-coverage-cargo-

      - name: Generate coverage report
        # Run coverage on main crate with lib + integration tests
        # Exclude ffi_comparison (requires local mozjpeg) and slow benchmark tests
        run: |
          cargo llvm-cov -p mozjpeg-rs \
            --lib \
            --test codec_comparison \
            --test encode_tests \
            --test encoder_validation \
            --test ffi_validation \
            --test parity_tests \
            --test known_issues \
            --test pixel_diff_analysis \
            --test edge_padding \
            --test edge_cropping \
            --test block_comparison \
            --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Cross-compiled 32-bit and ARM testing with QEMU emulation
  # NOTE: Only runs lib tests (pure Rust). Integration tests require mozjpeg-sys
  # which builds C code via cc/cmake — this may fail under cross-compilation if
  # the cross Docker image lacks nasm/cmake. If integration tests are needed,
  # the cross Docker images would need to be customized with those build tools.
  test-cross:
    name: Cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (cross)
        run: cross build -p mozjpeg-rs --target ${{ matrix.target }}

      - name: Build release (cross)
        run: cross build -p mozjpeg-rs --release --target ${{ matrix.target }}

      - name: Test lib (cross/QEMU)
        run: cross test -p mozjpeg-rs --lib --target ${{ matrix.target }}


  # WASM build check - mozjpeg-rs is pure Rust (no C FFI in default features),
  # so it should compile for wasm32. Dependencies (wide, multiversion, archmage)
  # have varying WASM support, so this is continue-on-error until fully validated.
  test-wasm:
    name: WASM Build Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: Build for WASM (experimental)
        env:
          RUSTFLAGS: "-C target-feature=+simd128"
        run: cargo build -p mozjpeg-rs --target wasm32-wasip1

  # Publish dry-run (only on PRs, to catch packaging issues early)
  publish-check:
    name: Publish Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check packaging
        run: cargo publish --dry-run
