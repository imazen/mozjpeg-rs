[package]
name = "sys-local"
version = "0.1.0"
edition = "2024"
description = "Local FFI bindings to mozjpeg with test exports"
links = "mozjpeg"
publish = false  # Internal test infrastructure only

[dependencies]
libc = "0.2"

[build-dependencies]
cmake = "0.1"

# The FFI comparison test and the trace/quant examples live in this crate rather
# than in the root crate: they need `sys-local`, and the root crate must not
# depend on it (publish = false would break `cargo package` for mozjpeg-rs).
[dev-dependencies]
mozjpeg-rs = { path = "../..", features = ["png"] }
jpeg-decoder = "0.3.2"
png = "0.18.1"
